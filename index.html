<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图片</title>
    <!-- 手机自适应 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            padding: 0; /* 不留边距 */
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            width: 100%; /* 图片铺满宽度 */
        }
    </style>
</head>
<body>
    <!-- 图片直接置顶，没有任何居中 -->
    <img src="ambf.jpeg" alt="展示图片">
</body>
</html>
