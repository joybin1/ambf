<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图片</title>
    <!-- 关键：手机自适应 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            padding: 10px;
        }
        img {
            max-width: 100%;   /* 不超出屏幕 */
            height: auto;       /* 比例不变形 */
            display: block;
            border-radius: 4px; /* 可选：轻微圆角 */
        }
    </style>
</head>
<body>
    <img src="ambf.jpeg" alt="展示图片">
</body>
</html>
